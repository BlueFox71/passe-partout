apply plugin: 'com.android.application'

// Signature de la version « release » : mobile/build.ps1 passe le chemin du fichier signing.properties
// (hors dépôt, dans %APPDATA%/PassePartout/android-signing) par -PppSigningProperties=… ou la variable
// d'environnement PP_SIGNING_PROPERTIES. Clés lues : storePassword, keyAlias, keyPassword et, en option,
// storeFile (par défaut passe-partout.jks à côté du fichier). Sans ce fichier, l'APK release n'est pas signé.
def ppSigningPath = project.findProperty('ppSigningProperties') ?: System.getenv('PP_SIGNING_PROPERTIES')
def ppSigning = null
if (ppSigningPath) {
    def propsFile = file(ppSigningPath)
    if (!propsFile.isFile()) {
        throw new GradleException("Fichier de signature introuvable : ${propsFile}")
    }
    ppSigning = new Properties()
    propsFile.withInputStream { ppSigning.load(it) }
    ppSigning.setProperty('resolvedStoreFile',
        ppSigning.getProperty('storeFile') ?: new File(propsFile.parentFile, 'passe-partout.jks').path)
}

android {
    namespace = "fr.passepartout.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.passepartout.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (ppSigning != null) {
            release {
                storeFile file(ppSigning.getProperty('resolvedStoreFile'))
                storePassword ppSigning.getProperty('storePassword')
                keyAlias ppSigning.getProperty('keyAlias')
                keyPassword ppSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (ppSigning != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Plugin natif PassePartoutPlugin : empreinte (BiometricPrompt + CryptoObject) et lecture du QR code
    // par ZXing, entièrement local (aucun service Google, aucune télémétrie).
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.google.zxing:core:3.5.3"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
